services:
  pauloapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao-os-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - gestao-os-network
    restart: unless-stopped

networks:
  gestao-os-network:
    driver: bridge
